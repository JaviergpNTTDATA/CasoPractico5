spring:
  application:
    name: account-service
  config:
    import: optional:configserver:http://localhost:8888

  # Fallback if config server is down, to avoid "Failed to determine a suitable RDBC Connection URL" and similar errors.
  # This avoids the "Failed to determine a suitable RDBC Connection URL" error when config
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/novabank_accounts
    username: banco_user
    password: 1234
  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
