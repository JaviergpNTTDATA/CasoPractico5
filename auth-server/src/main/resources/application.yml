server:
  port: 9001

spring:
  application:
    name: auth-server
  config:
    import: optional:configserver:${CONFIG_SERVER_URL}

  r2dbc:
    url: ${AUTH_R2DBC_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  sql:
    init:
      mode: always

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
